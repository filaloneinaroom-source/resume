<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Портфолио frontend-разработчика Сезим Боскунбаевой: адаптивные сайты, интерфейсы и проекты.">
  <title>Портфолио — Сезим Боскунбаева, frontend-разработчик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
  color-scheme: light;
  --ink: #20211f;
  --muted: #777873;
  --paper: #f8f8f5;
  --green: #c9f06a;
  --line: #e7e8e2;
  --font-body: "DM Sans", sans-serif;
  --font-display: "Manrope", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.container { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }
.site-header { position: sticky; top: 0; z-index: 10; background: rgb(248 248 245 / 90%); backdrop-filter: blur(14px); border-bottom: 1px solid rgb(32 33 31 / 6%); }
.nav { height: 78px; display: flex; align-items: center; justify-content: space-between; }
.brand { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: -1.3px; }
.brand span { color: #8eae3f; }
.nav-links { display: flex; gap: 38px; color: #555650; font-size: 13px; }
.nav-links a, .footer a { transition: color .2s ease; }
.nav-links a:hover, .footer a:hover { color: #78952d; }
.nav-cta { border: 1px solid #dcded5; border-radius: 999px; padding: 11px 17px; font-size: 12px; font-weight: 600; transition: background .2s ease, border-color .2s ease; }
.nav-cta:hover { background: var(--green); border-color: var(--green); }
.nav-cta span { margin-left: 8px; }
.hero { min-height: 680px; position: relative; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; padding-top: 30px; padding-bottom: 95px; }
.hero-copy { position: relative; z-index: 1; padding-bottom: 15px; }
.eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 24px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #9dc84b; box-shadow: 0 0 0 4px rgb(157 200 75 / 16%); }
h1, h2, h3, p { margin-top: 0; }
h1, h2 { font-family: var(--font-display); letter-spacing: -3.5px; }
h1 { max-width: 650px; margin-bottom: 24px; font-size: clamp(48px, 6.2vw, 76px); line-height: 1.08; font-weight: 600; }
.highlight { position: relative; z-index: 0; white-space: nowrap; }
.highlight::after { position: absolute; z-index: -1; right: -5px; bottom: 7px; left: -5px; height: 18px; background: var(--green); content: ""; transform: rotate(-1deg); }
.hero-description { max-width: 460px; margin-bottom: 29px; color: #6c6e68; font-size: 15px; line-height: 1.8; }
.hero-description strong { color: var(--ink); }
.hero-actions { display: flex; align-items: center; gap: 25px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 18px; min-height: 49px; padding: 0 21px; border-radius: 999px; font-size: 12px; font-weight: 700; transition: transform .2s ease, background .2s ease; }
.button:hover { transform: translateY(-2px); }
.button-primary { background: var(--ink); color: white; }
.button-primary:hover { background: #41443b; }
.text-link { font-size: 12px; font-weight: 600; }
.text-link span { margin-left: 5px; }
.hero-meta { display: flex; align-items: center; gap: 12px; margin-top: 49px; }
.avatar { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 50%; background: #e8edda; color: #637c2e; font-size: 12px; font-weight: 700; }
.hero-meta div:last-child { display: grid; gap: 3px; }
.hero-meta strong { font-size: 12px; }
.hero-meta div:last-child span { color: var(--muted); font-size: 11px; }
.hero-art { position: relative; width: min(100%, 470px); aspect-ratio: 1; justify-self: end; overflow: hidden; border-radius: 47% 53% 48% 52% / 48% 44% 56% 52%; background: #e7ebdc; }
.hero-art::before, .hero-art::after { position: absolute; content: ""; border: 1px solid rgb(72 88 47 / 13%); border-radius: 50%; }
.hero-art::before { inset: 9%; }
.hero-art::after { inset: 18%; }
.art-sun { position: absolute; top: 22%; left: 25%; width: 51%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(145deg, #e0f5a3, #b5d66e); box-shadow: 0 20px 65px rgb(121 151 64 / 20%); }
.art-orbit { position: absolute; z-index: 1; top: 50%; left: 50%; width: 104%; height: 38%; border: 1px solid rgb(74 86 49 / 45%); border-radius: 50%; transform: translate(-50%, -50%) rotate(-42deg); }
.orbit-two { width: 109%; height: 53%; transform: translate(-50%, -50%) rotate(48deg); }
.art-card { position: absolute; z-index: 2; display: flex; align-items: center; gap: 13px; padding: 12px 16px; border: 1px solid rgb(255 255 255 / 70%); border-radius: 13px; background: rgb(255 255 255 / 78%); box-shadow: 0 10px 30px rgb(54 64 38 / 9%); font-size: 11px; font-weight: 600; }
.card-top { top: 25%; right: 6%; }
.card-bottom { bottom: 23%; left: 7%; }
.card-icon { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 8px; background: var(--green); font-size: 15px; }
.card-bottom .card-icon { order: -1; background: #ecefe5; }
.art-caption { position: absolute; right: 13%; bottom: 9%; color: #777d69; font-size: 8px; letter-spacing: 2px; }
.art-spark { position: absolute; z-index: 1; color: #829d43; }
.spark-one { top: 18%; left: 17%; font-size: 22px; }
.spark-two { right: 20%; bottom: 22%; font-size: 15px; }
.scroll-cue { position: absolute; bottom: 33px; left: 0; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; }
.scroll-cue span { display: block; width: 23px; height: 1px; background: #9ca094; }
.section { padding-top: 110px; padding-bottom: 110px; }
.about { background: #f0f1eb; }
.about-grid { display: grid; grid-template-columns: 1fr .8fr; gap: 115px; align-items: start; }
.about h2, .section-heading h2, .contact h2 { margin: 0; font-size: clamp(39px, 5vw, 58px); line-height: 1.15; font-weight: 600; }
.about h2 .highlight::after, .section-heading h2 .highlight::after { height: 13px; bottom: 4px; }
.about-content { padding-top: 42px; }
.about-content p { color: #70716b; font-size: 14px; line-height: 1.85; }
.about-content .about-lead { margin-bottom: 16px; color: var(--ink); font-family: var(--font-display); font-size: 19px; line-height: 1.6; letter-spacing: -.5px; }
.skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
.skills span, .project-tags span { padding: 8px 12px; border: 1px solid #dfe1d9; border-radius: 999px; color: #64665f; font-size: 10px; }
.projects { padding-top: 115px; padding-bottom: 125px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 43px; }
.section-heading .eyebrow { margin-bottom: 17px; }
.section-heading h2 { font-size: clamp(38px, 4.5vw, 53px); }
.section-heading > p { max-width: 290px; margin-bottom: 5px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.project-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 27px; }
.project-card { max-width: 720px; }
.project-visual { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 9px; background: #e9e9df; }
.project-visual img { display: block; width: 100%; height: 100%; object-fit: cover; }
.project-number { position: absolute; top: 17px; left: 17px; display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: rgb(255 255 255 / 70%); font-size: 9px; }
.project-info { display: flex; align-items: center; justify-content: space-between; margin: 21px 2px 14px; }
.project-info h3 { margin-bottom: 5px; font-family: var(--font-display); font-size: 16px; letter-spacing: -.4px; }
.project-info p { margin-bottom: 0; color: var(--muted); font-size: 11px; }
.project-arrow { display: grid; width: 35px; height: 35px; place-items: center; border: 1px solid var(--line); border-radius: 50%; transition: background .2s ease; }
.project-card:hover .project-arrow { background: var(--green); }
.project-tags { display: flex; gap: 7px; }
.project-tags span { padding: 6px 10px; font-size: 9px; }
.contact { position: relative; overflow: hidden; background: #20221e; color: white; }
.contact-inner { position: relative; z-index: 1; }
.contact .eyebrow { color: #a9aca1; }
.contact h2 { margin-bottom: 19px; font-size: clamp(45px, 6vw, 70px); }
.contact h2 .highlight::after { background: var(--green); }
.contact-inner > p:not(.eyebrow) { margin-bottom: 26px; color: #b6b8b1; font-size: 13px; }
.button-light { background: var(--green); color: var(--ink); }
.button-light:hover { background: #d9f69c; }
.contact-decoration { position: absolute; top: -135px; right: 2%; color: rgb(201 240 106 / 9%); font-size: 380px; line-height: 1; }
.footer { display: flex; min-height: 88px; align-items: center; justify-content: space-between; }
.footer p { margin: 0; color: var(--muted); font-size: 10px; }
.footer p span { color: #8eae3f; }
.footer > a:last-child { font-size: 11px; }

@media (max-width: 760px) {
  .container { width: min(100% - 40px, 560px); }
  .nav { height: 68px; }
  .nav-links { gap: 17px; font-size: 11px; }
  .nav-links a:first-child { display: none; }
  .nav-cta { display: none; }
  .hero { min-height: auto; grid-template-columns: 1fr; gap: 35px; padding-top: 72px; padding-bottom: 85px; }
  .hero-copy { padding-bottom: 0; }
  h1 { font-size: clamp(48px, 11vw, 68px); }
  .hero-art { width: min(83%, 390px); justify-self: center; }
  .hero-meta { margin-top: 35px; }
  .scroll-cue { bottom: 26px; }
  .section { padding-top: 78px; padding-bottom: 78px; }
  .about-grid { grid-template-columns: 1fr; gap: 22px; }
  .about-content { padding-top: 0; }
  .section-heading { align-items: start; flex-direction: column; gap: 15px; margin-bottom: 30px; }
  .section-heading > p { max-width: 380px; }
  .project-grid { grid-template-columns: 1fr; gap: 36px; }
  .project-visual { aspect-ratio: 16 / 9; }
  .footer { min-height: 80px; }
}

@media (max-width: 430px) {
  .container { width: calc(100% - 36px); }
  .nav-links { gap: 14px; }
  .nav-links a { font-size: 10px; }
  .hero { padding-top: 57px; }
  h1 { letter-spacing: -2.7px; }
  .hero-description { font-size: 14px; }
  .hero-actions { align-items: flex-start; flex-direction: column; gap: 17px; }
  .hero-art { width: 92%; }
  .about h2, .section-heading h2 { letter-spacing: -2.5px; }
  .contact h2 { letter-spacing: -2.8px; }
  .footer { flex-wrap: wrap; gap: 12px; padding-block: 20px; }
  .footer p { order: 1; width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
